<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Control ROV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Control ROV">
<style>
html,body{margin:0;height:100%;background:#05070d;color:#e6edf7;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
#sp{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;box-sizing:border-box}
#sp img{width:96px;height:96px;border-radius:22px}
#sp p{margin:0;font-size:15px;color:#9fb3cf}
.rd{width:34px;height:34px;border:3px solid #1f6fc0;border-top-color:#12a9e0;border-radius:50%;animation:g 0.9s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
button{background:#12a9e0;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div id="sp"><img src="icon-192.png" alt=""><div class="rd"></div><p>Cargando Control ROV…</p></div>
<script>
/* La app se descarga siempre actualizada desde Google (Apps Script); si no hay señal usa la última copia */
var EXEC = 'https://script.google.com/macros/s/AKfycbyNgKqQRMo_n0y00DWayHOo282x0l20wiLjcdgberzXlig3FmUGaIg8zbIsF9bhZ9Dw/exec';
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
function arrancar(html) {
  var extra = '<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">' +
    '<meta name="theme-color" content="#0b1020"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">' +
    '<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Control ROV"><title>Control ROV</title>' +
    '<script>window.API_URL = ' + JSON.stringify(EXEC) + ';<\/script>';
  html = html.replace('<base target="_top">', '').replace('<head>', '<head>' + extra);
  document.open(); document.write(html); document.close();
}
function sinSenal() {
  document.getElementById('sp').innerHTML = '<img src="icon-192.png" alt=""><p>No se pudo conectar.<br>Revisa la señal e intenta de nuevo.</p><button onclick="location.reload()">Reintentar</button>';
}
fetch(EXEC + '?app=html&t=' + Date.now()).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (h) { if (h.indexOf('id="v-inicio"') < 0 && h.indexOf("id='v-inicio'") < 0) throw new Error('respuesta'); try { localStorage.setItem('appHtml', h); } catch (e) {} arrancar(h); })
  .catch(function () { var h = null; try { h = localStorage.getItem('appHtml'); } catch (e) {} if (h) arrancar(h); else sinSenal(); });
</script>
</body>
</html>
